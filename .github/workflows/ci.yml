name: CI

on:
  pull_request:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'chore/**']

# Phase 6.4.1 [CI-004]: local-тай ижил — апп = app_user (RLS), системийн ажил = postgres.
# Supabase key-ууд `supabase status -o env`-ээс (step "Supabase env") → $GITHUB_ENV.
env:
  DATABASE_URL: postgresql://app_user:change_in_production@localhost:54322/postgres?schema=public
  SYSTEM_DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres?schema=public
  DIRECT_URL: postgresql://postgres:postgres@localhost:54322/postgres?schema=public
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long   # EnvConfig: min 32
  DEV_TENANT_SLUG: test-tenant

jobs:
  test:
    name: Lint · Unit · Integration · Build
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22   # @supabase/supabase-js realtime: native WebSocket (Node 22+) — Dockerfile ч 22 [CI-005]
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Unit тест @prisma/client-ийн enum-уудыг (UserRole г.м.) импортлодог → generate-гүй бол undefined [CI-005]
      - name: Prisma Client
        run: pnpm db:generate

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0   # = pnpm-lock (таны машин) — "latest" гаралтын формат/зан төлөв өөрчлөгддөг [CI-006]

      # `supabase start` нь supabase/migrations/*.sql + seed.sql-г автоматаар ажиллуулдаг [CI-002]
      - name: Start Supabase (local)
        run: npx supabase start

      - name: Supabase env
        run: |
          npx supabase status -o env > /tmp/sb.env 2>/tmp/sb.err || true
          eval "$(sed -E 's/^export //' /tmp/sb.env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          # [CI-006] түлхүүр алга бол хоосон утгаар үргэлжлүүлэхгүй — гаралтын түлхүүрийн НЭРСИЙГ (утгагүй) хэвлээд унана
          if [ -z "${API_URL:-}" ] || [ -z "${ANON_KEY:-}" ] || [ -z "${SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::supabase status -o env: API_URL/ANON_KEY/SERVICE_ROLE_KEY алга"; npx supabase --version
            sed -E 's/=.*$/=…/' /tmp/sb.env; cat /tmp/sb.err; exit 1
          fi
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      # QA-21 [MIG-001]: migration-ууд ажилласан DB ↔ prisma/schema — baseline-аас өөр зөрүү гарвал унана
      - name: Prisma schema drift
        run: node scripts/ci/prisma-drift.mjs --url "$DIRECT_URL"

      - name: Lint
        run: pnpm turbo lint

      # 2026-11-07: баримтын шалгалт агентаас CI руу (AGENTS.md §3)
      - name: Docs check
        run: pnpm docs:check

      # `pnpm test` = core-kernel + web-shell unit (сервергүй) — e2e тусдаа job-д
      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm turbo test:integration

      - name: Build
        run: pnpm turbo build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: test       # Unit/Integration дууссаны дараа
    env:
      DEBUG_MENU_ENABLED: 'true'

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22   # @supabase/supabase-js realtime: native WebSocket (Node 22+) — Dockerfile ч 22 [CI-005]
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: node node_modules/@playwright/test/cli.js install chromium --with-deps

      - name: Setup Supabase
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0   # = pnpm-lock (таны машин) — "latest" гаралтын формат/зан төлөв өөрчлөгддөг [CI-006]

      - name: Start Supabase
        run: npx supabase start

      - name: Supabase env
        run: |
          npx supabase status -o env > /tmp/sb.env 2>/tmp/sb.err || true
          eval "$(sed -E 's/^export //' /tmp/sb.env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          # [CI-006] түлхүүр алга бол хоосон утгаар үргэлжлүүлэхгүй — гаралтын түлхүүрийн НЭРСИЙГ (утгагүй) хэвлээд унана
          if [ -z "${API_URL:-}" ] || [ -z "${ANON_KEY:-}" ] || [ -z "${SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::supabase status -o env: API_URL/ANON_KEY/SERVICE_ROLE_KEY алга"; npx supabase --version
            sed -E 's/=.*$/=…/' /tmp/sb.env; cat /tmp/sb.err; exit 1
          fi
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"

      # Prisma Client (backend dev + e2e fixture), admin@test.mn Auth хэрэглэгч, Кемп e2e-ийн эрх
      - name: Prepare (Prisma, test user, camp grant)
        run: |
          pnpm db:generate
          pnpm dev:test-user
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -f supabase/dev/camp_e2e_grant.sql

      # Playwright webServer: backend + web-shell; globalSetup → e2e:fixture (tenant/хэрэглэгч үүсгэж, дараа нь устгана)
      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
