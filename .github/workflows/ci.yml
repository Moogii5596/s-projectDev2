name: CI

# v0.2.5 H3 (#18): `main`-ийн push → «Deploy staging» нь энэ workflow-г workflow_call-оор дуудаж, дараа нь staging migration хийнэ.
# Зөвхөн баримт (docs/**, *.md) өөрчлөгдсөн бол → зөвхөн docs:check (~1 мин); бусад үед бүтэн CI. Тест үргэлж local Supabase-д (cloud DB ✖).
# Actions минут (private repo, 2,000 мин/сар): branch push-д ажиллахгүй — зөвхөн PR (нэг commit = нэг run).
# E2E (PO шийдвэр 2026-11-11): PR-д ✖ — зөвхөн «Deploy staging» (main merge, workflow_call) ба гараар (workflow_dispatch).
#   «Deploy production»-ий preflight staging ногоон шаарддаг → production үргэлж e2e-ээр шалгагдсан commit.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Phase 6.4.1 [CI-004]: local-тай ижил — апп = app_user (RLS), системийн ажил = postgres.
# Supabase key-ууд `.github/actions/supabase-start` → $GITHUB_ENV.
env:
  DATABASE_URL: postgresql://app_user:change_in_production@localhost:54322/postgres?schema=public
  SYSTEM_DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres?schema=public
  DIRECT_URL: postgresql://postgres:postgres@localhost:54322/postgres?schema=public
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long   # EnvConfig: min 32
  DEV_TENANT_SLUG: test-tenant
  SUPABASE_CLI_VERSION: 2.122.1   # = root devDependency `supabase` (pnpm-lock) — "latest" гаралтын формат/зан төлөв өөрчлөгддөг [CI-006]

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        name: Docs-only эсэх
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; fi
          if [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -qE '^0+$'; then base="$PUSH_BEFORE"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Харьцуулах суурь алга ($EVENT) → бүтэн CI"; echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$base" "$GITHUB_SHA")
          echo "$changed"
          code=$(echo "$changed" | grep -vE '^docs/|\.md$' | grep -c . || true)
          if [ "$code" -gt 0 ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; echo "Зөвхөн баримт → docs:check л"; fi

  # 2026-11-07: баримтын шалгалт агентаас CI руу (AGENTS.md §3). node_modules шаардахгүй
  docs:
    name: Docs check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/docs/gen-codebase-docs.mjs --check

  test:
    name: Lint · Unit · Integration · Build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm хувилбар = package.json `packageManager`
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22   # @supabase/supabase-js realtime: native WebSocket (Node 22+) — Dockerfile ч 22 [CI-005]
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Unit тест @prisma/client-ийн enum-уудыг (UserRole г.м.) импортлодог → generate-гүй бол undefined [CI-005]
      - name: Prisma Client
        run: pnpm db:generate

      # `supabase start` нь supabase/migrations/*.sql + seed.sql-г автоматаар ажиллуулдаг [CI-002]
      - name: Start Supabase (local, cached images)
        uses: ./.github/actions/supabase-start
        with:
          cli-version: ${{ env.SUPABASE_CLI_VERSION }}

      # QA-21 [MIG-001]: migration-ууд ажилласан DB ↔ prisma/schema — baseline-аас өөр зөрүү гарвал унана
      - name: Prisma schema drift
        run: node scripts/ci/prisma-drift.mjs --url "$DIRECT_URL"

      - name: Lint
        run: pnpm turbo lint

      # `pnpm test` = core-kernel + web-shell unit (сервергүй) — e2e тусдаа job-д
      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm turbo test:integration

      - name: Build
        run: pnpm turbo build

  # Supabase хоёр job-д зэрэг асахад host-ийн 54322 порт давхцаж болзошгүй тул test дууссаны дараа ажиллуулна.
  # ubuntu-24.04-д бэхэлсэн: Playwright-ийн албан ёсоор дэмждэг OS; ubuntu-latest (26.04) 2026-11-11-нд apt DNS алдаатай байсан.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    env:
      DEBUG_MENU_ENABLED: 'true'

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22   # @supabase/supabase-js realtime: native WebSocket (Node 22+) — Dockerfile ч 22 [CI-005]
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}

      # apt-гүй: runner image-д Chrome-ийн системийн сангууд бий (2026-11-11: apt *.ubuntu.com DNS алдаагаар E2E бүгд унасан).
      # Chromium асахгүй бол л --with-deps (apt) руу буцна.
      - name: Install Playwright browsers
        run: |
          node node_modules/@playwright/test/cli.js install chromium
          if ! node -e "require('@playwright/test').chromium.launch().then(b => b.close()).catch(e => { console.error(e.message); process.exit(1); })"; then
            echo "::warning::Chromium асахгүй байна → системийн сангуудыг apt-аар суулгана"
            node node_modules/@playwright/test/cli.js install-deps chromium
          fi

      - name: Start Supabase (local, cached images)
        uses: ./.github/actions/supabase-start
        with:
          cli-version: ${{ env.SUPABASE_CLI_VERSION }}
          vite-env: 'true'

      # Prisma Client (backend dev + e2e fixture), admin@test.mn Auth хэрэглэгч, Кемп e2e-ийн эрх
      - name: Prepare (Prisma, test user, camp grant)
        run: |
          pnpm db:generate
          pnpm dev:test-user
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -f supabase/dev/camp_e2e_grant.sql

      # Playwright webServer: backend + web-shell; globalSetup → e2e:fixture (tenant/хэрэглэгч үүсгэж, дараа нь устгана)
      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
