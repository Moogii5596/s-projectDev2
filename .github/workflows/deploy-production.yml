# S Project — «Deploy production» (G3). PO гараар: Actions → Deploy production → Run workflow → tag.
# Агент энэ workflow-г ажиллуулахгүй (AGENTS.md §4). Staging = `main` push-ээр автомат (#18/H3, deploy.yml).
# Урсгал (ADR-011, tech plan H-7): шалгалт → нөөц → migration → API deploy → API health → web deploy → web health.
#
# Шаардлагатай Secrets (Settings → Secrets and variables → Actions):
#   PROD_DB_URL              — Supabase `s-project-prod` шууд холболт (5432, postgres role). Pooler ✖.
#   BACKUP_AGE_RECIPIENT     — age public key (age1…); private key зөвхөн PO-д (H5-тай нэг)
#   RENDER_PROD_DEPLOY_HOOK  — Render `s-project-api-prod` deploy hook URL (auto-deploy унтраасан)
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROD_PROJECT_ID — Vercel `s-project-prod` (git auto-deploy унтраасан)
# Variables:
#   PROD_API_URL  — жнь https://api.sino.gobiverse.website (зам `/api/v1/health` нэмнэ)
#   PROD_WEB_URL  — жнь https://sino.gobiverse.website
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (жнь v0.2.5 эсвэл яаралтай засвар v0.2.5.1). rc ✖'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}

jobs:
  preflight:
    name: Шалгалт (tag, CI, secrets)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Tag-ийн формат
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::Tag '$TAG' буруу. Production: vX.Y.Z эсвэл vX.Y.Z.N (rc ✖ — docs/VERSIONING.md)"; exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag → commit, branch, хувилбар
        id: tag
        run: |
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "::error::Tag '$TAG' repo-д алга"; exit 1; }
          sha="$(git rev-list -n 1 "refs/tags/$TAG")"
          version="${TAG#v}"
          base="$(printf '%s' "$version" | cut -d. -f1-3)"
          if git merge-base --is-ancestor "$sha" origin/main; then
            echo "commit $sha ∈ main"
          elif [ "$version" != "$base" ] && git branch -r --contains "$sha" | grep -Eq '^\s*origin/hotfix/'; then
            echo "commit $sha ∈ hotfix/* (яаралтай засвар)"
          else
            echo "::error::$TAG ($sha) main-д (эсвэл 4 оронтой tag бол hotfix/*-д) алга"; exit 1
          fi
          app_version="$(git show "$sha:apps/core-kernel/src/config/app-version.ts" | sed -nE "s/^export const APP_VERSION = '([^']+)';.*/\1/p")"
          if [ "$app_version" != "$version" ] && [ "$app_version" != "$base" ]; then
            echo "::error::APP_VERSION='$app_version' ≠ tag '$TAG' — release-д хувилбарын дугаараа шинэчил"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: CI ногоон эсэх (тухайн commit)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          n="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success" --jq '.total_count')"
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::$SHA дээр CI амжилттай ажиллаагүй — production-д гаргахгүй"; exit 1
          fi

      - name: Secrets, variables бүрэн эсэх
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          RENDER_PROD_DEPLOY_HOOK: ${{ secrets.RENDER_PROD_DEPLOY_HOOK }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROD_PROJECT_ID: ${{ secrets.VERCEL_PROD_PROJECT_ID }}
          PROD_API_URL: ${{ vars.PROD_API_URL }}
          PROD_WEB_URL: ${{ vars.PROD_WEB_URL }}
        run: |
          missing=""
          for k in PROD_DB_URL BACKUP_AGE_RECIPIENT RENDER_PROD_DEPLOY_HOOK VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROD_PROJECT_ID PROD_API_URL PROD_WEB_URL; do
            [ -n "$(printenv "$k")" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then echo "::error::Тохируулаагүй:$missing"; exit 1; fi

  backup:
    name: Нөөц (deploy-ийн өмнө)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - name: pg_dump 17 + age
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 age >/dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Шифрлэсэн нөөц
        id: dump
        env:
          DB_URL: ${{ secrets.PROD_DB_URL }}
          AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          f="$(bash scripts/ci/db-backup.sh "prod-predeploy-$TAG" backup)"
          echo "file=$f" >> "$GITHUB_OUTPUT"

      - name: Artifact (30 хоног)
        uses: actions/upload-artifact@v4
        with:
          name: prod-predeploy-${{ inputs.tag }}
          path: ${{ steps.dump.outputs.file }}
          retention-days: 30
          if-no-files-found: error

  migrate:
    name: Migration (supabase db push)
    needs: [preflight, backup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1   # = root package.json devDependency

      - name: Хүлээгдэж буй migration (dry-run)
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        run: supabase db push --db-url "$PROD_DB_URL" --dry-run

      - name: Migration хэрэгжүүлэх
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        run: supabase db push --db-url "$PROD_DB_URL"

  deploy-api:
    name: API deploy (Render) + health
    needs: [preflight, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Render deploy hook (тухайн commit)
        env:
          HOOK: ${{ secrets.RENDER_PROD_DEPLOY_HOOK }}
          SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          code="$(curl -sS -o /tmp/render.json -w '%{http_code}' -X POST "${HOOK}&ref=${SHA}")"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Render deploy hook HTTP $code"; exit 1
          fi

      - name: Health — шинэ commit ажиллаж эхлэх хүртэл (≤ 20 мин)
        env:
          API: ${{ vars.PROD_API_URL }}
          SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          for i in $(seq 1 80); do
            body="$(curl -fsS --max-time 20 "${API%/}/api/v1/health" 2>/dev/null || true)"
            status="$(printf '%s' "$body" | jq -r '.status // empty' 2>/dev/null || true)"
            commit="$(printf '%s' "$body" | jq -r '.commit // empty' 2>/dev/null || true)"
            if [ "$status" = "ok" ] && [ -n "$commit" ] && [ "${SHA#"$commit"}" != "$SHA" ]; then
              echo "API ok: $(printf '%s' "$body" | jq -c '{version,commit}')"; exit 0
            fi
            echo "[$i] хүлээж байна: status=${status:-—} commit=${commit:-—}"; sleep 15
          done
          echo "::error::API шинэ commit-оор ($SHA) health ok болсонгүй — Render-ийн deploy log-г шалга. Rollback: Render → Rollback, DB → backup artifact"
          exit 1

  deploy-web:
    name: Web deploy (Vercel) + health
    needs: [preflight, deploy-api]
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROD_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Vercel build + deploy (--prod)
        run: |
          npm i -g vercel@65 >/dev/null
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "Vercel: $url"

      - name: Web health
        env:
          WEB: ${{ vars.PROD_WEB_URL }}
        run: |
          for i in $(seq 1 20); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$WEB" || true)"
            [ "$code" = "200" ] && { echo "Web ok ($WEB)"; exit 0; }
            echo "[$i] HTTP ${code:-—}"; sleep 10
          done
          echo "::error::$WEB HTTP 200 өгсөнгүй"; exit 1

      - name: Хураангуй
        if: always()
        env:
          SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          {
            echo "### Deploy production — \`$TAG\`"
            echo "- commit: \`$SHA\`"
            echo "- нөөц: artifact \`prod-predeploy-$TAG\` (30 хоног, age шифрлэлттэй)"
            echo "- API: ${{ vars.PROD_API_URL }}/api/v1/health · Web: ${{ vars.PROD_WEB_URL }}"
          } >> "$GITHUB_STEP_SUMMARY"
