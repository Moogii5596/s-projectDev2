# S Project — v0.1.6 Кемп пилот: тусдаа Redis (dev-ийн 6379-тэй холилдохгүй)
# 127.0.0.1-д л холбогдоно (LAN/интернэтэд хаалттай). pilot.ps1 асаана:
#   docker compose -f deploy/pilot/docker-compose.redis.yml -p s-project-pilot-redis up -d
services:
  redis:
    image: redis:7-alpine
    container_name: s-project-pilot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - pilot_redis_data:/data

volumes:
  pilot_redis_data:
