# S Project — Development только Redis
# Usage: docker-compose -f docker-compose.dev.yml up -d
# NestJS нь host-д pnpm dev-ээр ажиллана

version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: s-project-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  redis_dev_data:
    driver: local
