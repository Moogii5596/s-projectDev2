<header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 4px; background: #FFFFFF; border-bottom: 1px solid #E2E5E0">
<a href="Main.dc.html" aria-label="Буцах" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #16191D">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
</a>
<div style="flex: 1; font-size: 17px; font-weight: 600">Шинэ пост</div>
<a href="Main.dc.html" style="height: 36px; padding: 0 16px; border-radius: 18px; background: #0D6B5B; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center">Илгээх</a>
</header>

<div style="flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 16px">

<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-size: 13px; font-weight: 600; padding: 0; margin-bottom: 8px">Төрөл</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #C7CCC5; background: #FFFFFF; font: inherit; font-size: 14px; color: #16191D">Энгийн пост</button>
<button type="button" aria-pressed="true" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #0D6B5B; background: #0D6B5B; font: inherit; font-size: 14px; font-weight: 600; color: #FFFFFF">Засварын хүсэлт</button>
<button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #C7CCC5; background: #FFFFFF; font: inherit; font-size: 14px; color: #16191D">Хоолны гомдол</button>
<button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #C7CCC5; background: #FFFFFF; font: inherit; font-size: 14px; color: #16191D">ХАБ анхааруулга</button>
</div>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="post-text" style="font-size: 13px; font-weight: 600">Юу болсон бэ?</label>
<textarea id="post-text" rows="4" style="box-sizing: border-box; padding: 12px 14px; border: 1px solid #C7CCC5; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 16px; line-height: 1.45; color: #16191D; resize: none">Блок 7-ийн 00 өрөөний угаалтуурын доороос ус алдаж байна. Шал нойтон байна.</textarea>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="post-room" style="font-size: 13px; font-weight: 600">Байршил</label>
<select id="post-room" style="height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #C7CCC5; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 16px; color: #16191D">
<option>Блок 7 · 7-00 өрөө</option>
<option>Бусад (бичиж оруулах)</option>
</select>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600">Зураг <span style="font-weight: 400; color: #5B636B">2 / 6</span></div>
<div style="display: flex; gap: 8px">
<div role="img" aria-label="Хавсаргасан зураг 1" style="width: 84px; height: 84px; border-radius: 10px; background: repeating-linear-gradient(135deg, #D9DED6 0 8px, #CDD3CA 8px 16px)"></div>
<div role="img" aria-label="Хавсаргасан зураг 2" style="width: 84px; height: 84px; border-radius: 10px; background: repeating-linear-gradient(135deg, #D9DED6 0 8px, #CDD3CA 8px 16px)"></div>
<button type="button" aria-label="Зураг нэмэх" style="width: 84px; height: 84px; border-radius: 10px; border: 1.5px dashed #9AA29A; background: #FFFFFF; color: #5B636B; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>
</div>
<div style="font-size: 12px; line-height: 1.45; color: #5B636B">Зураг 5 MB хүртэл шахагдана, байршил зэрэг мэдээлэл (EXIF) устгагдана.</div>
</div>

<section aria-label="Хэн харах вэ" style="background: #FFFFFF; border: 1px solid #E2E5E0; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600">Хэн харах вэ</div>
<div style="font-size: 13px; line-height: 1.45; color: #5B636B">Засварын хүсэлт болж бүртгэгдэнэ. <b style="color: #16191D">Засварчин, кемп менежер</b> харж, ажлын явц энэ постын доор харагдана.</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<span style="font-size: 12px; padding: 4px 10px; border-radius: 12px; background: #E6F2EF; color: #0D6B5B">Илгээсэн</span>
<span style="font-size: 12px; padding: 4px 10px; border-radius: 12px; background: #F0F1EE; color: #5B636B">Хүлээн авсан</span>
<span style="font-size: 12px; padding: 4px 10px; border-radius: 12px; background: #F0F1EE; color: #5B636B">Засаж байна</span>
<span style="font-size: 12px; padding: 4px 10px; border-radius: 12px; background: #F0F1EE; color: #5B636B">Шийдсэн</span>
</div>
</section>

</div>
</div>
